        company: Intelligent Information Processing Lab (IIPL), Chung-Ang University
        url: https://iiplcau.github.io/
        start_date: "2020.03"
        highlights:
          - Visual recognition algorithms based on computer vision and multimodal AI
          - Semantic segmentation, cross-domain generalization, and few-shot and continual learning
          - Model design and implementation, benchmark construction, ablation studies, and performance validation
          - International publications and industry-collaborative R&D projects
      - position: AI Inference Engine Development
        company: Industry–academia R&D project funded by the Ministry of Culture, Sports and Tourism (MCST)
        start_date: "2020.07"
        end_date: "2023.12"
        highlights:
          - Developed models that predict emotion, concentration, and working memory from images, video, and speech
          - Implemented a shared inference interface integrated with the service platform
      - position: Optical Satellite Imagery Dataset Construction
        company: Research project related to the Korea Aerospace Research Institute (KARI)
        date: "2021"
        highlights:
          - Took part in labeling an optical satellite imagery dataset for AI training
      - position: SKT AI Fellowship (2nd cohort)
        company: SK Telecom
        start_date: "2020.05"
        end_date: "2020.12"
        highlights:
          - Implemented a best-shot inference model for high-resolution photos and videos, and extracted best shots from videos and burst photos

  - title: Selected Research
    type: projects
    entries:
      - name: "HyCal: Few-Shot Continual Learning across Heterogeneous Domains"
        url: /projects/#hycal
        date: "2026"
        summary: CVPR 2026 · Co-first author
        highlights:
          - Designed the 8-domain XD-VSCIL benchmark and a training-free prototype calibration combining cosine similarity and Mahalanobis distance; more than 4.5%p average accuracy gain under high domain imbalance
      - name: "RI-Prune: Visual Token Efficiency for Multi-Image VLMs"
        url: /projects/#ri-prune
        date: "2026"
        summary: CIKM 2026 · Oral
        highlights:
          - Visual token selection without additional training or attention scores, based on query relevance, cross-image correspondence, and intra-image representativeness
      - name: Background Shortcuts in Visual Recognition
        url: /projects/#background-shortcuts
        date: "2024–2026"
        summary: Learning to Detour (WACV 2024) · NegSep (NeurIPS 2026 Workshop)
        highlights:
          - Analyzed and reduced reliance on background cues, through object–background recombination for weakly supervised segmentation and through separated negative-label scores for zero-shot OOD detection
      - name: Weakly Supervised Object Detection for Construction Safety
        url: /projects/#construction
        date: "2024"
        summary: IEEE Access 2024 · Co-first author
        highlights:
          - Detection of small and thin objects (ladders, outriggers, hardhats) on 3,615 curated construction-site images, with CAM localization and spatial relations to judge safe and unsafe states
      - name: "RS-SCOPE: Cross-Dataset Continual Segmentation for Remote Sensing"
        url: /projects/#rs-scope
        date: "2026"
        summary: Ongoing research
        highlights:
          - Benchmark and evaluation of class-incremental semantic segmentation under sensor and annotation shift across remote-sensing datasets

