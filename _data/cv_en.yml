name: Eunju Lee
label: Ph.D. Student · Computer Vision & Multimodal AI
email: dmswn5829@cau.ac.kr
website: https://ejlee5826.github.io/
summary: >-
  I study computer vision and vision-language learning, focusing on object recognition and segmentation
  and on performance degradation under domain shift. In an industry internship and research projects,
  I have built datasets, implemented and improved models, designed benchmarks and evaluation protocols,
  and analyzed performance across conditions.

