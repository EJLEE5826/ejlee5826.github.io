name: Eunju Lee
label: Ph.D. Student · Computer Vision & Multimodal AI
email: dmswn5829@cau.ac.kr
website: https://ejlee5826.github.io/
summary: >-
  I work on computer vision and multimodal AI, including visual recognition, semantic segmentation,
  domain generalization, and few-shot and continual learning. Through an industry research internship and
  academic and industry-collaborative research, I have designed and implemented visual recognition
  algorithms, built datasets and benchmarks, and validated performance quantitatively.

