  - title: Experience
    type: experience
    entries:
      - position: AI Research Intern
        company: NCSOFT · Vision AI Understanding Team
        start_date: "2022.09"
        end_date: "2023.02"
        summary: Open-Vocabulary Semantic Segmentation & Attribute Recognition
        highlights:
          - Built an open-vocabulary dataset from Fashionpedia and studied vision-language segmentation and attribute recognition models
          - Proposed a non-binary mask visual prompt that improved mIoU and mACC over OV-Seg without additional trainable parameters ([details](/projects/#ncsoft))

  - title: Research Experience
    type: experience
    entries:
